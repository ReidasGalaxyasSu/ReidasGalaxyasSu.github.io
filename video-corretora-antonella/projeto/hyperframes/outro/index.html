<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      :root { --navy: #0b1a33; --gold: #f6c343; --red: #ff4d4d; --ink: #ffffff; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 1080px; height: 1920px; font-family: "Montserrat", sans-serif; }
      #bg { position: absolute; inset: 0; background: radial-gradient(120% 80% at 50% 40%, rgba(16,36,70,0.86) 0%, rgba(7,16,34,0.96) 70%); }
      #quote { position: absolute; left: 90px; top: 360px; width: 900px; text-align: center; color: var(--ink); text-transform: uppercase; }
      #qmark { font-family: "Playfair Display", serif; font-weight: 700; font-size: 220px; line-height: 0.6; color: var(--gold); height: 120px; }
      .q { display: block; font-weight: 800; font-size: 64px; line-height: 1.12; }
      .big { font-weight: 900; font-size: 104px; line-height: 1.05; }
      .gold { color: var(--gold); }
      .red { color: var(--red); }
      #rule { width: 160px; height: 8px; border-radius: 8px; background: var(--gold); margin: 40px auto 0; transform-origin: 50% 50%; }
      #ctaw { position: absolute; left: 0; top: 1150px; width: 1080px; display: flex; justify-content: center; }
      #cta {
        display: flex; align-items: center; gap: 18px; white-space: nowrap;
        background: var(--gold); color: var(--navy); font-weight: 900; font-size: 50px;
        padding: 26px 46px; border-radius: 999px; box-shadow: 0 16px 40px rgba(0,0,0,0.45);
      }
      #cta svg { width: 56px; height: 56px; }
      #sub { position: absolute; left: 90px; width: 900px; top: 1290px; text-align: center; color: rgba(255,255,255,0.9); font-weight: 600; font-size: 36px; line-height: 1.3; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3.6" data-width="1080" data-height="1920">
      <div id="card" class="clip" data-start="0" data-duration="3.6" data-track-index="0" data-track-kind="graphics" data-layout-allow-overlap>
        <div id="bg"></div>
        <div id="quote">
          <div id="qmark">“</div>
          <span class="q" id="q1">Quem compra imóvel com medo</span>
          <span class="q big gold" id="q2">erra menos</span>
          <span class="q" id="q3">do que quem</span>
          <span class="q big red" id="q4">não compra</span>
          <span class="q" id="q5">por medo.</span>
          <div id="rule"></div>
        </div>
        <div id="ctaw"><div id="cta">
          <svg viewBox="0 0 24 24" fill="none" stroke="#0b1a33" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
          <span>ME CHAMA NO DIRECT</span>
        </div></div>
        <div id="sub">Salva e envia pra quem vive<br />inventando desculpa</div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#bg", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, 0);
      tl.fromTo("#qmark", { scale: 0.3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2.4)" }, 0.12);
      ["#q1", "#q2", "#q3", "#q4", "#q5"].forEach((id, i) => {
        tl.fromTo(id, { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.26, ease: "power3.out" }, 0.22 + i * 0.16);
      });
      tl.fromTo("#q2", { scale: 1.25 }, { scale: 1, duration: 0.3, ease: "back.out(2)" }, 0.38);
      tl.fromTo("#q4", { scale: 1.25 }, { scale: 1, duration: 0.3, ease: "back.out(2)" }, 0.70);
      tl.fromTo("#rule", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power2.out" }, 1.0);
      tl.fromTo("#cta", { y: 60, opacity: 0, scale: 0.8 }, { y: 0, opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, 1.15);
      tl.to("#cta", { scale: 1.06, duration: 0.18, ease: "power1.inOut", yoyo: true, repeat: 3 }, 2.0);
      tl.fromTo("#sub", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 1.4);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
