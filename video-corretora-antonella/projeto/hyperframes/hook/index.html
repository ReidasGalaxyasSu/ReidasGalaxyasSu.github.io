<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      :root {
        --navy: #0b1a33;
        --gold: #f6c343;
        --red: #ff3b3b;
        --ink: #ffffff;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 1080px; height: 1920px; font-family: "Montserrat", sans-serif; }
      #shade {
        position: absolute; left: 0; top: 0; width: 1080px; height: 760px;
        background: linear-gradient(180deg, rgba(7,16,34,0.82) 0%, rgba(7,16,34,0.55) 45%, rgba(7,16,34,0) 100%);
      }
      #chipw { position: absolute; left: 0; top: 196px; width: 1080px; display: flex; justify-content: center; }
      #chip {
        display: flex; align-items: center; gap: 14px;
        padding: 14px 30px; border-radius: 999px;
        background: var(--navy); border: 3px solid var(--gold);
        color: var(--gold); font-weight: 800; font-size: 34px; letter-spacing: 0.04em; white-space: nowrap;
        box-shadow: 0 10px 30px rgba(0,0,0,0.35);
      }
      #chip svg { width: 40px; height: 40px; }
      .line { position: absolute; left: 0; width: 1080px; text-align: center; font-weight: 900; line-height: 1.02; text-transform: uppercase; }
      #l1 { top: 300px; }
      #l1 .w { font-size: 118px; color: var(--ink); text-shadow: 0 6px 22px rgba(0,0,0,0.55); display: inline-block; }
      #l1 .red { color: var(--red); }
      #arrow { display: inline-block; width: 100px; height: 100px; vertical-align: -6px; margin-left: 10px; }
      #l2 { top: 300px; }
      #l2a { font-size: 76px; color: var(--ink); display: inline-block; text-shadow: 0 6px 22px rgba(0,0,0,0.55); }
      #l2b {
        margin-top: 10px; display: inline-block; font-size: 86px; color: var(--navy);
        background: var(--gold); padding: 8px 28px 4px; border-radius: 18px;
        box-shadow: 0 12px 34px rgba(0,0,0,0.4);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.2" data-width="1080" data-height="1920">
      <div id="hookgrp" class="clip" data-start="0" data-duration="4.2" data-track-index="0" data-track-kind="graphics" data-layout-allow-overlap>
        <div id="shade"></div>
        <div id="chipw"><div id="chip">
          <svg viewBox="0 0 24 24" fill="none" stroke="#f6c343" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>
          <span>QUEM QUER COMPRAR IMÓVEL</span>
        </div></div>
        <div id="l1" class="line">
          <span class="w" id="w1">OS JUROS</span><br />
          <span class="w red" id="w2">SUBIRAM<svg id="arrow" viewBox="0 0 24 24" fill="none" stroke="#ff3b3b" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg></span>
        </div>
        <div id="l2" class="line">
          <span id="l2a">...MAS SÓ NOS</span><br />
          <span id="l2b">BANCOS PRIVADOS</span>
        </div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // frame 0 already carries the hook (thumbnail): only a settle, never invisible
      tl.fromTo("#chip", { scale: 1.08 }, { scale: 1, duration: 0.35, ease: "back.out(2)" }, 0);
      tl.fromTo("#w1", { scale: 1.18 }, { scale: 1, duration: 0.3, ease: "power3.out" }, 0);
      tl.fromTo("#w2", { scale: 1 }, { scale: 1.16, duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1 }, 1.32);
      tl.fromTo("#arrow", { y: 18, x: -18 }, { y: 0, x: 0, duration: 0.5, ease: "power2.out" }, 1.4);
      // swap to the twist
      tl.to("#l1", { y: -60, opacity: 0, duration: 0.22, ease: "power2.in" }, 2.08);
      tl.fromTo("#l2a", { y: 50, opacity: 0 }, { y: 0, opacity: 1, duration: 0.25, ease: "power3.out" }, 2.22);
      tl.fromTo("#l2b", { scale: 0.4, opacity: 0, rotation: -4 }, { scale: 1, opacity: 1, rotation: -2, duration: 0.32, ease: "back.out(2.2)" }, 3.18);
      tl.to("#l2b", { scale: 1.08, duration: 0.12, yoyo: true, repeat: 1, ease: "power1.inOut" }, 3.62);
      // exit
      tl.to(["#chipw", "#l2", "#shade"], { y: -40, opacity: 0, duration: 0.28, ease: "power2.in", stagger: 0.03 }, 3.86);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
