<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J4 Montagem 3D</title>
<style>
  :root { --bg:#c9cbce; --panel:#ffffffe6; --ink:#16181b; --muted:#5b616a; --accent:#1d4ed8; --line:#d7dade; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#1d2024; --panel:#25292ee6; --ink:#eef0f2; --muted:#a3aab3; --accent:#7aa2ff; --line:#3a4048; } }
  :root[data-theme="dark"] { --bg:#1d2024; --panel:#25292ee6; --ink:#eef0f2; --muted:#a3aab3; --accent:#7aa2ff; --line:#3a4048; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow:hidden; }
  #view { position:fixed; inset:0; }
  .panel { position:fixed; left:16px; right:16px; bottom:16px; max-width:560px; margin:0 auto; background:var(--panel);
           border:1px solid var(--line); border-radius:12px; padding:12px 14px; backdrop-filter: blur(6px); }
  h1 { font-size:15px; margin:0 0 8px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  button { font:inherit; border:1px solid var(--line); background:transparent; color:var(--ink); border-radius:8px; padding:6px 12px; cursor:pointer; }
  button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  input[type=range] { flex:1; min-width:140px; accent-color:var(--accent); }
  .legend { margin-top:8px; color:var(--muted); font-size:12px; display:flex; gap:10px; flex-wrap:wrap; }
  .legend label { display:flex; gap:4px; align-items:center; cursor:pointer; }
  #status { position:fixed; top:16px; left:16px; color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<div id="view"></div>
<div id="status">Carregando modelo…</div>
<div class="panel">
  <h1>Realtracker J4 · montagem e desmontagem</h1>
  <div class="row">
    <button id="bMont" class="on">Montado</button>
    <button id="bExp">Explodido</button>
    <button id="bPlay">▶ Animar</button>
    <input id="t" type="range" min="0" max="1" step="0.001" value="0" aria-label="Linha do tempo">
  </div>
  <div class="legend" id="sets"></div>
</div>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const el = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
el.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(35, 1, 0.01, 50);
camera.position.set(1.8, 1.6, 1.9);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.35, -0.35);
controls.enableDamping = true;
function resize() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

// Quadros do GLB (24 fps): 1 = MONTADO, 90 = EXPLODIDO, 200 = MONTADO
const T_EXP = (90 - 1) / 24, T_END = (200 - 1) / 24;
let mixer, action, clip, playing = false, target = null;
const slider = document.getElementById('t');
const btn = { m: bMont, e: bExp, p: bPlay };
function setTime(s) { if (!action) return; action.time = s; mixer.update(0); slider.value = s / T_END; }
function mark(which) { btn.m.classList.toggle('on', which === 'm'); btn.e.classList.toggle('on', which === 'e'); btn.p.classList.toggle('on', which === 'p'); }

new GLTFLoader().load('j4_rastreador.glb', (gltf) => {
  scene.add(gltf.scene);
  mixer = new THREE.AnimationMixer(gltf.scene);
  clip = gltf.animations[0];
  action = mixer.clipAction(clip); action.play(); action.paused = true;
  setTime(0);
  document.getElementById('status').textContent = 'Arraste para girar · role para aproximar';
  const legend = document.getElementById('sets');
  for (const n of ['carcaca_j4', 'tampa_j4', 'placa_j4', 'bateria_j4', 'chicote_j4']) {
    const o = gltf.scene.getObjectByName(n); if (!o) continue;
    const l = document.createElement('label');
    l.innerHTML = `<input type="checkbox" checked> ${n}`;
    l.firstChild.onchange = (ev) => { o.visible = ev.target.checked; };
    legend.appendChild(l);
  }
}, undefined, (e) => { document.getElementById('status').textContent = 'Erro ao carregar o GLB: ' + e.message; });

btn.m.onclick = () => { playing = false; target = 0; mark('m'); };
btn.e.onclick = () => { playing = false; target = T_EXP; mark('e'); };
btn.p.onclick = () => { playing = !playing; target = null; mark(playing ? 'p' : ''); };
slider.oninput = () => { playing = false; target = null; mark(''); setTime(slider.value * T_END); };

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  if (action) {
    if (playing) setTime((action.time + dt) % T_END);
    else if (target !== null) {
      // percorre a linha do tempo até a pose pedida (montagem usa a 2ª metade do clipe)
      let t = action.time, goal = target;
      if (goal === 0 && t > T_EXP) goal = T_END;
      const step = dt * 1.0, d = goal - t;
      if (Math.abs(d) <= step) { setTime(goal === T_END ? 0 : goal); target = null; }
      else setTime(t + Math.sign(d) * step);
    }
  }
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
