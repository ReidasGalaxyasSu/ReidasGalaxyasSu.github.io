/* HUD chrome shared by every sim. 1rem = 10px at the 1080x1350 reference
   size; runtime sets html font-size from the viewport so it scales. */

:root {
  --bg: #09090a;
  --fg: #ece6d6;
  --dim: rgba(236, 230, 214, 0.64);
  --mute: rgba(236, 230, 214, 0.38);
  --faint: rgba(236, 230, 214, 0.16);
  --line: rgba(236, 230, 214, 0.14);
  --panel: rgba(9, 9, 10, 0.9);
  --accent: #f2b632;
  --top: 13.4rem;
  --bot: 30.5rem;
}
:root[data-theme='light'] {
  --bg: #f3f2ee;
  --fg: #151515;
  --dim: rgba(21, 21, 21, 0.66);
  --mute: rgba(21, 21, 21, 0.42);
  --faint: rgba(21, 21, 21, 0.16);
  --line: rgba(21, 21, 21, 0.16);
  --panel: rgba(243, 242, 238, 0.93);
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
#app {
  position: fixed; inset: 0; color: var(--fg);
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-variant-ligatures: none; -webkit-font-smoothing: antialiased;
}
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hud { position: absolute; inset: 0; pointer-events: none; }
.hud.hidden { display: none; }
.accent { color: var(--accent); }

/* header */
.hdr {
  position: absolute; left: 0; right: 0; top: 0; height: var(--top);
  padding: 2.4rem 2.8rem 0;
  background: linear-gradient(var(--bg) 0%, var(--bg) 78%, transparent 100%);
}
.row { display: flex; align-items: baseline; white-space: nowrap; }
.row1 { gap: 5.6rem; }
.title { display: flex; align-items: center; gap: 1.3rem; font-size: 3.6rem; font-weight: 600; letter-spacing: 0.04em; }
.title .bar { display: inline-block; width: 0.75rem; height: 3.6rem; background: var(--accent); }
.sub { font-size: 1.75rem; color: var(--dim); letter-spacing: 0.08em; }
.right { margin-left: auto; font-size: 1.6rem; color: var(--dim); letter-spacing: 0.1em; }
.row2 { margin-top: 2rem; font-size: 1.95rem; }
.row2 .stage { width: 21rem; letter-spacing: 0.05em; }
.row2 .cmd { color: var(--fg); }
.row2 .time { margin-left: auto; letter-spacing: 0.05em; }
.prog { position: absolute; left: 2.8rem; right: 2.8rem; bottom: 1.2rem; height: 0.35rem; }
.prog i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }

/* viewport overlays */
.ann { position: absolute; inset: 0; overflow: hidden; }
.ann div {
  position: absolute; transform: translate(1.4rem, -50%); white-space: nowrap;
  font-size: 1.7rem; letter-spacing: 0.04em; color: var(--fg);
  text-shadow: 0 0 0.6rem var(--bg), 0 0 1.2rem var(--bg);
}
.ann div.a { color: var(--accent); }
.ann div.box {
  padding: 0.8rem 1.1rem; border: 1px solid var(--line); background: var(--panel);
  text-shadow: none; line-height: 1.45; font-size: 1.55rem;
}
.ann div.box b { color: var(--accent); font-weight: 600; }
.wm {
  position: absolute; right: 3rem; bottom: calc(var(--bot) + 1.6rem);
  font-size: 2.3rem; letter-spacing: 0.06em; color: var(--fg); opacity: 0.3;
}

/* bottom panel */
.bot {
  position: absolute; left: 0; right: 0; bottom: 0; height: var(--bot);
  display: flex; border-top: 1px solid var(--line); background: var(--panel);
  padding: 2rem 2.8rem 1.6rem;
}
.term { flex: 1; min-width: 0; display: flex; flex-direction: column; padding-right: 2.6rem; }
.thead { display: flex; align-items: baseline; gap: 2.4rem; font-size: 1.75rem; white-space: nowrap; }
.thead .host { font-size: 2.1rem; }
.thead .path { color: var(--dim); }
.thead .status { margin-left: auto; font-size: 1.5rem; letter-spacing: 0.1em; display: flex; align-items: center; gap: 0.9rem; }
.thead .status i { width: 1rem; height: 1rem; border-radius: 50%; background: var(--accent); display: inline-block; }
.prompt { margin-top: 1.9rem; font-size: 2.2rem; white-space: nowrap; overflow: hidden; }
.logs { margin-top: 1.1rem; font-size: 1.85rem; line-height: 1.52; flex: 1; overflow: hidden; }
.logs div { white-space: nowrap; overflow: hidden; text-overflow: clip; }
.logs .ln { color: var(--mute); display: inline-block; width: 6.4rem; }
.logs .hl { color: var(--accent); }
.caret { display: inline-block; width: 0.95em; height: 1.05em; vertical-align: -0.15em; background: var(--accent); margin-left: 0.15em; }
.tfoot { font-size: 1.35rem; color: var(--mute); white-space: nowrap; letter-spacing: 0.04em; }
.side {
  width: 31%; border-left: 1px solid var(--line); padding-left: 2.2rem;
  display: flex; flex-direction: column;
}
.shead { font-size: 1.45rem; letter-spacing: 0.12em; }
.mini { width: 100%; flex: 1; min-height: 0; display: block; margin: 0.8rem 0; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem 1.4rem; font-size: 1.35rem; color: var(--mute); }
.stats b { display: block; font-size: 2rem; color: var(--fg); font-weight: 600; letter-spacing: 0.02em; }
.sfoot { margin-top: 0.8rem; font-size: 1.3rem; color: var(--mute); letter-spacing: 0.05em; }
.baseline { position: absolute; left: 2.8rem; right: 2.8rem; bottom: 0.9rem; height: 0.25rem; background: var(--line); }
.baseline i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }

/* director layers */
.dir-glitch { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.dir-flash {
  position: absolute; inset: 0; pointer-events: none; opacity: 0; mix-blend-mode: screen;
  background: radial-gradient(ellipse 75% 55% at 50% 45%, var(--accent) 0%, transparent 70%), rgba(255,255,255,0.18);
}
.dir-story {
  position: absolute; left: 0; right: 0; top: 0; bottom: 0; pointer-events: none;
  display: flex; align-items: flex-end; justify-content: center; padding: 0 4.5rem 6rem; opacity: 0;
}
.cap { text-align: center; max-width: 96rem; position: relative; }
.cap::before {
  content: ''; position: absolute; inset: -6rem -10rem; z-index: -1;
  background: radial-gradient(ellipse 50% 50% at 50% 55%, rgba(0,0,0,0.62) 0%, rgba(0,0,0,0) 100%);
}
:root[data-theme='light'] .cap::before { background: radial-gradient(ellipse 50% 50% at 50% 55%, rgba(243,242,238,0.8) 0%, rgba(243,242,238,0) 100%); }
.cap-main {
  font-family: 'Inter', 'Inter Variable', system-ui, sans-serif; font-weight: 800;
  font-size: 11.5rem; line-height: 0.98; letter-spacing: -0.035em; color: var(--fg);
  text-shadow: 0 0.4rem 2.4rem rgba(0,0,0,0.55);
}
.cap.num .cap-main { font-size: 15rem; font-variant-numeric: tabular-nums; letter-spacing: -0.045em; }
.cap-main .w { display: inline-block; transform-origin: 50% 70%; }
.cap-main .w.hl { background: var(--accent); color: #0a0a0a; padding: 0 0.14em; text-shadow: none; border-radius: 0.06em; }
.cap-sub {
  margin-top: 2rem; font-size: 2.7rem; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--fg); opacity: 0.85; min-height: 1.3em;
}
.cap-tag {
  display: inline-block; margin-bottom: 1.8rem; padding: 0.5rem 1.2rem; font-size: 2.2rem; letter-spacing: 0.12em;
  border: 1px solid var(--accent); color: var(--accent); background: rgba(0,0,0,0.5);
}

/* Console do robô garçom — claro, um acento laranja para o que está trabalhando, ciano para os LEDs do robô. */
:root {
  --ink: #23262b; --mute: #8b8478; --faint: #ddd4c5; --line: #e7dfd1; --panel: rgba(252, 250, 246, .94);
  --or: #e2792b; --cy: #12a8a2; --ok: #2f9e64; --warn: #c8432b; --bgc: #ece6dc;
}
html, body { background: var(--bgc); }
#app { font-family: Inter, system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
#gl { touch-action: none; cursor: grab; }
#gl.drag { cursor: grabbing; }
.mo { font-family: 'JetBrains Mono', ui-monospace, monospace; }
.ui { position: absolute; inset: 0; pointer-events: none; }
.ui > * { pointer-events: auto; }
.card { position: absolute; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 6px 24px rgba(90, 70, 40, .10); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.ph { display: flex; align-items: center; gap: 8px; font: 700 10.5px 'JetBrains Mono', monospace; letter-spacing: 1.6px; text-transform: uppercase; }
.ph i { display: block; width: 3px; height: 12px; background: var(--or); }
.ph .n { margin-left: auto; color: var(--mute); font-weight: 500; }
.sm { font: 500 9.5px 'JetBrains Mono', monospace; letter-spacing: 1.3px; color: var(--mute); text-transform: uppercase; }
.bt { font: 700 10.5px 'JetBrains Mono', monospace; letter-spacing: 1px; color: var(--ink); background: #fffdf9; border: 1px solid var(--faint); border-radius: 6px; padding: 7px 9px; cursor: pointer; text-transform: uppercase; display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: background .12s, border-color .12s, color .12s; user-select: none; -webkit-user-select: none; }
.bt:hover { border-color: #c9bda9; }
.bt.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.bt.go { background: var(--or); color: #fff; border-color: var(--or); }
.bt.go:disabled, .bt:disabled { opacity: .45; cursor: default; }
.bt:focus-visible { outline: 2px solid var(--or); outline-offset: 2px; }
.row { display: flex; gap: 6px; flex-wrap: wrap; }
.row .bt { flex: 1; }
hr { border: 0; border-top: 1px solid var(--line); margin: 10px 0; }

/* cabeçalho */
#hdr { left: 16px; top: 14px; padding: 10px 14px 10px 0; display: flex; align-items: center; gap: 12px; background: none; border: 0; box-shadow: none; backdrop-filter: none; }
#hdr .badge { width: 46px; height: 46px; border-radius: 8px; background: var(--or); color: #fff; display: grid; place-items: center; font: 700 15px 'JetBrains Mono', monospace; letter-spacing: 1px; }
#hdr h1 { margin: 0; font-size: 22px; font-weight: 750; letter-spacing: -.4px; line-height: 1.05; }
#hdr h1 span { color: var(--or); font-weight: 400; }
#hdr p { margin: 3px 0 0; }

/* chip do tour */
#tour { left: 50%; bottom: 96px; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; padding: 7px 12px; font: 700 9.5px 'JetBrains Mono', monospace; letter-spacing: 1.2px; cursor: pointer; white-space: nowrap; }
#tour i { width: 7px; height: 7px; border-radius: 50%; background: var(--or); display: block; }
#tour.on i { animation: blink 1.2s steps(2) infinite; }
@keyframes blink { 50% { opacity: .15; } }

/* missão */
#pMissao { left: 16px; top: 84px; width: 290px; padding: 13px 14px 14px; }
#pMissao .mesas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
.mesa { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; padding: 8px 9px; text-transform: none; }
.mesa b { font: 700 12px Inter, sans-serif; letter-spacing: 0; }
.mesa span { font: 500 8.6px 'JetBrains Mono', monospace; letter-spacing: .5px; color: var(--mute); text-align: left; line-height: 1.3; }
.mesa.on span { color: #cfc8bc; }
.mesa .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 5px; vertical-align: 1px; }
.itens { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.item { justify-content: flex-start; text-transform: none; font: 600 11px Inter, sans-serif; letter-spacing: 0; padding: 7px 8px; }
.item .ic { font-size: 14px; line-height: 1; }
.item .ck { margin-left: auto; width: 13px; height: 13px; border-radius: 3px; border: 1.5px solid var(--faint); }
.item.on { background: #fff3e8; color: var(--ink); border-color: var(--or); }
.item.on .ck { background: var(--or); border-color: var(--or); }
#msg { margin-top: 10px; font-size: 11.5px; line-height: 1.45; min-height: 16px; color: #5d574e; }
#msg.err { color: var(--warn); }
#btnGo { width: 100%; margin-top: 10px; padding: 11px; font-size: 11.5px; }

/* telemetria */
#pTele { right: 16px; top: 66px; width: 262px; padding: 13px 14px; max-height: calc(100% - 82px); overflow: auto; }
.kv { display: grid; grid-template-columns: 1fr 1fr; gap: 9px 12px; margin-top: 10px; }
.kv div b { display: block; font: 700 16px 'JetBrains Mono', monospace; letter-spacing: -.3px; color: var(--ink); margin-top: 2px; }
.kv div b small { font-size: 10px; color: var(--mute); font-weight: 500; margin-left: 2px; }
.jt { display: grid; grid-template-columns: 26px 1fr 52px; gap: 4px 6px; align-items: center; margin-top: 8px; }
.jt .bar { height: 4px; background: #efe7da; border-radius: 2px; position: relative; overflow: hidden; }
.jt .bar i { position: absolute; top: 0; bottom: 0; background: var(--cy); }
.jt b { font: 600 11px 'JetBrains Mono', monospace; text-align: right; }
#gsch { display: block; margin: 8px auto 0; }
#estado { font-size: 13px; font-weight: 650; margin-top: 8px; line-height: 1.3; }

/* views e exibição */
#pVista { right: 16px; top: 14px; padding: 7px 8px; display: flex; gap: 10px; align-items: center; }
#pVista .ph { display: none; }
#pVista .row { flex-wrap: nowrap; gap: 4px; }
#pVista .row + .row { border-left: 1px solid var(--line); padding-left: 10px; }
#pVista .bt { padding: 6px 8px; font-size: 9.5px; }

/* linha do tempo */
#pTime { left: 322px; right: 294px; bottom: 16px; padding: 10px 14px 12px; display: flex; gap: 12px; align-items: center; }
#btnPlay { width: 42px; height: 42px; border-radius: 50%; padding: 0; font-size: 14px; flex: none; }
#tl { flex: 1; min-width: 0; }
#tlTop { display: flex; justify-content: space-between; gap: 10px; }
#tlLabel { font: 700 10px 'JetBrains Mono', monospace; letter-spacing: 1px; color: var(--or); text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#chips { display: flex; gap: 2px; margin-top: 7px; height: 16px; cursor: pointer; }
#chips div { position: relative; background: #efe7da; border-radius: 3px; overflow: hidden; min-width: 3px; }
#chips div i { position: absolute; left: 0; top: 0; bottom: 0; background: rgba(226, 121, 43, .35); }
#chips div.cur { background: #e8dccb; outline: 1.5px solid var(--or); }
#chips div.cur i { background: rgba(226, 121, 43, .7); }
#spd { width: 110px; flex: none; }
#spd input { width: 100%; accent-color: var(--or); }

/* peças */
#pPecas { left: 16px; bottom: 16px; width: 290px; max-height: calc(100% - 520px); min-height: 120px; padding: 12px 14px; display: flex; flex-direction: column; }
#plist { overflow: auto; margin-top: 8px; padding-right: 4px; }
#plist .cat { margin: 8px 0 4px; }
#plist button { display: block; width: 100%; text-align: left; font: 600 11.5px Inter, sans-serif; border: 0; background: none; padding: 5px 6px; border-radius: 5px; color: var(--ink); cursor: pointer; }
#plist button:hover { background: #f3ede3; }
#plist button.on { background: #fff3e8; color: var(--or); }

/* ficha da peça */
#pCard { left: 50%; top: 66px; transform: translateX(-50%); width: 360px; padding: 14px 16px; display: none; }
#pCard.show { display: block; }
#pCard h2 { margin: 6px 0 4px; font-size: 18px; letter-spacing: -.3px; }
#pCard p { margin: 0; font-size: 12.5px; line-height: 1.5; color: #4f4a42; }
#pCard table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 11.5px; }
#pCard td { padding: 4px 0; border-top: 1px solid var(--line); }
#pCard td:first-child { color: var(--mute); font: 500 9.5px 'JetBrains Mono', monospace; letter-spacing: 1px; text-transform: uppercase; width: 42%; }
#pCard .row { margin-top: 12px; }
#pCard .tag { display: inline-block; font: 700 9px 'JetBrains Mono', monospace; letter-spacing: 1.2px; text-transform: uppercase; color: #fff; background: var(--or); border-radius: 3px; padding: 3px 6px; }

/* rótulos com linhas de chamada */
#labels { position: absolute; inset: 0; pointer-events: none; }
#labels svg { position: absolute; inset: 0; overflow: visible; }
.lab { position: absolute; white-space: nowrap; pointer-events: auto; cursor: pointer; }
.lab b { display: flex; align-items: center; gap: 6px; font: 700 10px 'JetBrains Mono', monospace; letter-spacing: 1px; text-transform: uppercase; background: rgba(252, 250, 246, .9); padding: 3px 6px; border-radius: 4px; border: 1px solid var(--line); }
.lab b i { display: block; width: 6px; height: 6px; background: var(--or); }

/* balão de fala */
#say { position: absolute; padding: 6px 10px; font-size: 12.5px; font-weight: 650; border-radius: 10px; background: #fff; border: 1px solid var(--line); box-shadow: 0 4px 14px rgba(0, 0, 0, .08); transform: translate(-50%, -100%); white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .25s; }
#say::after { content: ''; position: absolute; left: 50%; bottom: -6px; width: 10px; height: 10px; background: #fff; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); transform: translateX(-50%) rotate(45deg); }

#tabs { display: none; }
#hint { position: absolute; left: 50%; bottom: 132px; transform: translateX(-50%); font: 500 10px 'JetBrains Mono', monospace; letter-spacing: 1px; color: var(--mute); text-transform: uppercase; white-space: nowrap; pointer-events: none; }

/* telas médias */
@media (max-width: 1360px) {
  #pVista { flex-direction: column; align-items: stretch; gap: 6px; }
  #pVista .row + .row { border-left: 0; padding-left: 0; }
  #pTele { top: 100px; max-height: calc(100% - 116px); }
}
@media (max-width: 1280px) {
  #pTime { left: 16px; right: 294px; }
  #pPecas { display: none; }
  #pPecas.force { display: flex; left: auto; right: 16px; top: 84px; bottom: auto; max-height: 60%; width: 262px; z-index: 3; }
}
/* celular: um painel por vez numa folha inferior, com abas */
@media (max-width: 760px) {
  #hdr { left: 10px; top: 8px; }
  #hdr .badge { width: 34px; height: 34px; font-size: 11px; }
  #hdr h1 { font-size: 16px; }
  #hdr p { display: none; }
  #tour { top: auto; bottom: calc(env(safe-area-inset-bottom) + 64px); font-size: 8.5px; }
  #hint { display: none; }
  #pMissao, #pTele, #pVista, #pPecas { display: none !important; left: 8px !important; right: 8px !important; width: auto !important; top: auto !important; bottom: calc(env(safe-area-inset-bottom) + 104px) !important; max-height: 46vh; overflow: auto; z-index: 3; }
  #pMissao.mob, #pTele.mob, #pVista.mob, #pPecas.mob { display: block !important; }
  #pVista.mob .ph { display: flex; }
  #pVista .row { flex-wrap: wrap; margin-top: 8px; }
  #pVista .row + .row { border-left: 0; padding-left: 0; }
  #pPecas.mob { display: flex !important; }
  #pTime { left: 8px; right: 8px; top: 56px; bottom: auto; padding: 8px 10px; gap: 8px; }
  #btnPlay { width: 34px; height: 34px; }
  #spd { width: 70px; }
  #tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; position: absolute; left: 8px; right: 8px; bottom: calc(env(safe-area-inset-bottom) + 8px); padding: 6px; z-index: 4; }
  #tabs .bt { padding: 10px 4px; font-size: 9.5px; }
  #pCard { top: 112px; left: 8px; right: 8px; width: auto; transform: none; max-height: 40vh; overflow: auto; z-index: 5; }
  .lab b { font-size: 8.5px; padding: 2px 4px; }
}
